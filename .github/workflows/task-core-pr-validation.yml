name: Task Core PR Validation

on:
  push:
    branches:
      - task-core-embedded-host-milestone

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm skill:artifacts:check
      - run: node --check skill/qoder-agent/scripts/qoder_agent_task.mjs
      - name: Commit regenerated Task artifact
        shell: bash
        run: |
          if git diff --quiet -- skill/qoder-agent/scripts/qoder_agent_task.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill/qoder-agent/scripts/qoder_agent_task.mjs
          git commit -m "build(skill): regenerate task artifact"
          git push

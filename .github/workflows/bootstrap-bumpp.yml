name: Bootstrap bumpp lockfile

on:
  push:
    branches:
      - codex/add-bumpp

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: codex/add-bumpp

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-bumpp.yml
          git add pnpm-lock.yaml
          git commit -m "build: update lockfile for bumpp"
          git push origin HEAD:codex/add-bumpp

name: Bootstrap bumpp release docs

on:
  push:
    branches:
      - codex/add-bumpp

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: codex/add-bumpp

      - name: Update release docs
        run: python3 .github/bootstrap_bumpp_docs.py

      - name: Commit docs and remove bootstrap helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-bumpp-docs.yml .github/bootstrap_bumpp_docs.py
          git add README.md README.zh-CN.md
          git commit -m "docs: use bumpp for releases"
          git push origin HEAD:codex/add-bumpp

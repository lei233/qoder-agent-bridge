name: Bootstrap bumpp release docs

on:
  push:
    branches:
      - codex/add-bumpp

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: codex/add-bumpp

      - name: Update release docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "README.md": (
                  '''## Release model

`package.json.version` is the sole release version authority. A formal release
is triggered only by pushing the exact `v<version>` tag, including prerelease
versions such as `v0.2.0-beta.1`. The tag must point at the clean checkout being
built. The release workflow rebuilds and validates the distribution, creates
only the installable Skill ZIP, attaches it to a draft GitHub Release, and then
publishes the release.

Repository **Release immutability must be enabled** before publishing formal
releases. The workflow verifies the published release with GitHub CLI and will
fail rather than treat a mutable release as valid. Source archives generated by
GitHub are repository snapshots and are not release artifacts for Skill
installation.
''',
                  '''## Release model

`package.json.version` remains the sole release version authority. Version bumps
are managed with `bumpp`; from a clean, up-to-date release branch run:

```sh
pnpm release
```

`bumpp` prompts for the next SemVer version, updates the root `package.json`,
creates a `chore: release v<version>` commit, creates the exact `v<version>` tag,
and pushes both commit and tag. Do not use recursive mode: the private workspace
packages intentionally do not carry independent versions.

The pushed `v<version>` tag triggers the Release Skill workflow, including
prerelease versions such as `v0.2.0-beta.1`. The workflow requires the tag to
match `package.json.version` exactly and point at the clean checkout being built.
It rebuilds and validates the distribution, creates only the installable Skill
ZIP, attaches it to a draft GitHub Release, and then publishes the release.

Repository **Release immutability must be enabled** before publishing formal
releases. The workflow verifies the published release with GitHub CLI and will
fail rather than treat a mutable release as valid. Source archives generated by
GitHub are repository snapshots and are not release artifacts for Skill
installation.
''',
              ),
              "README.zh-CN.md": (
                  '''## 发布模型

`package.json.version` 是唯一的 release version authority。正式发布只允许由精确的
`v<version>` tag 触发，也支持 `v0.2.0-beta.1` 这类 prerelease tag。tag 必须指向当前
被构建的 clean checkout。Release workflow 会重新构建并验证 distribution，只生成可
安装 Skill ZIP，把它先附加到 draft GitHub Release，再发布该 Release。

正式发布前必须在仓库中启用 **Release immutability**。workflow 会通过 GitHub CLI
验证发布后的 Release 是否真的不可变；如果仍是 mutable release，则任务失败，不会把它
当成有效正式发布。GitHub 自动生成的 source archives 只是仓库快照，不属于 Skill
安装 artifact。
''',
                  '''## 发布模型

`package.json.version` 仍然是唯一的 release version authority。版本变更统一由
`bumpp` 管理；在 clean 且已同步远端的发布分支上执行：

```sh
pnpm release
```

`bumpp` 会交互选择下一个 SemVer 版本，更新根 `package.json`，创建
`chore: release v<version>` commit，创建精确的 `v<version>` tag，并 push commit 与
tag。不要使用 recursive 模式；私有 workspace package 按设计不维护独立版本号。

push 的 `v<version>` tag 会触发 Release Skill workflow，也支持
`v0.2.0-beta.1` 这类 prerelease。workflow 会再次要求 tag 与
`package.json.version` 精确一致，并且 tag 必须指向当前被构建的 clean checkout。
随后它重新构建并验证 distribution，只生成可安装 Skill ZIP，把它先附加到 draft
GitHub Release，再发布该 Release。

正式发布前必须在仓库中启用 **Release immutability**。workflow 会通过 GitHub CLI
验证发布后的 Release 是否真的不可变；如果仍是 mutable release，则任务失败，不会把它
当成有效正式发布。GitHub 自动生成的 source archives 只是仓库快照，不属于 Skill
安装 artifact。
''',
              ),
          }

          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected release section not found in {name}")
              path.write_text(text.replace(old, new))
          PY

      - name: Commit docs and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-bumpp-docs.yml
          git add README.md README.zh-CN.md
          git commit -m "docs: use bumpp for releases"
          git push origin HEAD:codex/add-bumpp

name: Task Core Milestone Validation

on:
  push:
    branches:
      - task-core-embedded-host-milestone

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair validation blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('packages/core/src/runner/index.ts')
          s = p.read_text()
          s = s.replace('export {\n  MAX_TIMEOUT_MS,', 'export {\n  DEFAULT_MAX_MODEL_REQUEST_RETRIES,\n  MAX_MODEL_REQUEST_RETRIES,\n  MAX_TIMEOUT_MS,')
          p.write_text(s)

          p = Path('packages/cli/src/task-host/host.ts')
          s = p.read_text()
          s = s.replace('      const statePath = await realpath(prepared.statePath);', '      if (prepared === null) {\n        throw new TaskHostError("internal_error", "Worktree preparation returned no session.");\n      }\n      const preparedSession = prepared;\n      const statePath = await realpath(preparedSession.statePath);')
          s = s.replace('        qoderCwd: prepared.worktreeCwd,', '        qoderCwd: preparedSession.worktreeCwd,')
          p.write_text(s)

          p = Path('tests/task_execution_policy.test.ts')
          s = p.read_text()
          s = s.replace('    recovery: null,\n  };', '    recovery: null,\n    error: undefined,\n  };', 1)
          p.write_text(s)
          PY
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm skill:artifacts:check
      - run: node --check skill/qoder-agent/scripts/qoder_agent_task.mjs
      - name: Commit fixes and generated Task artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/runner/index.ts packages/cli/src/task-host/host.ts tests/task_execution_policy.test.ts skill/qoder-agent/scripts/qoder_agent_task.mjs
          if ! git diff --cached --quiet; then
            git commit -m "fix(task-host): satisfy milestone validation"
            git push origin HEAD:task-core-embedded-host-milestone
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-task-skill-artifact
          path: skill/qoder-agent/scripts/qoder_agent_task.mjs
          if-no-files-found: error

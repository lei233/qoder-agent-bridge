name: Task Core Milestone Validation

on:
  push:
    branches:
      - task-core-embedded-host-milestone

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm skill:artifacts:check
      - run: node --check skill/qoder-agent/scripts/qoder_agent_task.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-task-skill-artifact
          path: skill/qoder-agent/scripts/qoder_agent_task.mjs
          if-no-files-found: error
